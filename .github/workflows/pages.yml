name: Deploy to GitHub Pages

# Publishes the Svelte Mini Hub to GitHub Pages while retaining the legacy
# static arcade at /legacy/.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; newer pushes supersede in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.0.7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure Pages
        # enablement: true turns on GitHub Pages (with the Actions build type)
        # automatically on the first run, so no manual Settings toggle is needed.
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Check legacy app
        run: pnpm legacy:check

      - name: Build Svelte hub
        env:
          PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          PUBLIC_API_URL: http://127.0.0.1:8787
          PUBLIC_AI_OS_API_URL: http://127.0.0.1:8791
          PUBLIC_MACRO_LAB_API_URL: http://127.0.0.1:8792
          PUBLIC_SYNC_MODE: personal
        run: pnpm --filter @mini-hub/hub build

      - name: Add legacy arcade fallback
        run: |
          if [ ! -f apps/hub/build/index.html ]; then cp apps/hub/build/404.html apps/hub/build/index.html; fi
          touch apps/hub/build/.nojekyll
          mkdir -p apps/hub/build/legacy
          cp index.html manifest.webmanifest sw.js apps/hub/build/legacy/
          cp -r css js icons apps/hub/build/legacy/

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_attempt }}
          path: 'apps/hub/build'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

[project]
name = "mini-hub-ai-os-api"
version = "0.1.0"
description = "FastAPI capability substrate for local-first Personal AI OS infrastructure."
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.137.1",
  "uvicorn[standard]==0.49.0",
  "httpx==0.28.1",
  "pydantic==2.13.4",
  "pydantic-settings==2.14.1",
  "psutil==7.2.2"
]

[project.optional-dependencies]
test = ["pytest==9.1.0", "pytest-asyncio==1.4.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[project]
name = "mini-hub-ai-os-api"
version = "0.1.0"
description = "FastAPI capability substrate for local-first Personal AI OS infrastructure."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.124.0",
  "uvicorn[standard]>=0.38.0",
  "httpx>=0.28.0",
  "pydantic>=2.12.0",
  "pydantic-settings>=2.12.0",
  "psutil>=7.0.0"
]

[project.optional-dependencies]
test = ["pytest>=9.0.0", "pytest-asyncio>=1.3.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

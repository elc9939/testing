[project]
name = "mini-hub-macro-lab-api"
version = "0.1.0"
description = "Local Windows macro automation daemon for Mini Hub."
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.137.1",
  "uvicorn[standard]==0.49.0",
  "httpx==0.28.1",
  "pydantic==2.13.4",
  "pydantic-settings==2.14.1",
  "pynput==1.8.2",
  "watchdog==6.0.0",
  "pyperclip==1.11.0"
]

[project.optional-dependencies]
test = ["pytest==9.1.0", "pytest-asyncio==1.4.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

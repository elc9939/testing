[package]
name = "mini-hub-desktop"
version = "0.1.0"
description = "Desktop wrapper for the Mini Hub rewrite."
authors = ["Mini Hub"]
license = ""
repository = ""
edition = "2021"

[lib]
name = "mini_hub_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"

